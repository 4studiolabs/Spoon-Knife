name: html-a11y

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  html-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check img alt text and html lang
        run: |
          python3 - <<'EOF'
          import sys
          from html.parser import HTMLParser

          errors = []

          class Checker(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "img" and not a.get("alt"):
                      errors.append(f"img sem alt descritivo (linha {self.getpos()[0]})")
                  if tag == "html" and not a.get("lang"):
                      errors.append("tag html sem atributo lang")

          Checker().feed(open("index.html", encoding="utf-8").read())

          if errors:
              print("FALHAS:")
              for e in errors:
                  print(f" - {e}")
              sys.exit(1)
          print("OK: alts descritivos e lang presentes")
          EOF
